<!doctype html>
<!-- 경추 ROM «선 실측» 관제 미러링 (2026-10-16 신설 · 10-20 화면 다시 짬 · 10-21 다시 짬). 헤드셋 앱(RomLineMonitor)이 그대로 내보낸다.
     ★10-20 사용자 요구: 벽면UI는 이미지(/wall.jpg)가 아니라 /state 자료를 글자로 그린다(각도기 없음). 탭은 누르면 헤드셋 탭이 바뀐다(/cmd?c=top0..3 — 양방향).
     ★10-21 사용자 요구:
       위 = 로고(CoCo추나 전체) 왼쪽 · 타이틀(실행 중인 실습 — 앱이 /state title로 보낸다) 가운데
       본문 = 왼쪽 컨트롤러UI + 기록UI 묶음 · 오른쪽 미러링. 묶음의 높이는 영상 높이를 따라 같이 변한다(layout()).
              영상 둘레의 여백은 고정(PAD) — 영상 칸을 영상 비율대로 잡아, 창을 옆으로 늘려도 검은 부분이 늘지 않는다.
       아래 = 왼쪽 컨트롤러 좌우 연결(연결 = 초록 테두리) · 헤드셋 배터리 / 가운데 정보(앱 · 미러링 장수) / 오른쪽 해상도(드롭다운) · CSV 받기
       나가기 버튼은 뺐다(브라우저를 닫으면 된다). 컨트롤러 배터리는 OpenXR에서 읽을 수 없어 넣지 않았다(SDK: «no longer supported in OpenXR»). -->
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>XR-ROM경추</title>
<style>
  /* 색은 헤드셋 RomLineView와 같다 — 능동 #FF6B05 · 압박 #F2994D · 차이 #EBEBEB · 지금 탭 칸 #4D85D9 + 글자 #FFF233 · 다 잰 탭 #73E68C */
  :root { --bg:#0b0d11; --card:#12171e; --line:#262e39; --text:#e8ecf1; --dim:#b8c2d1; --note:#ccdbed; --ok:#3ccf7a; --bad:#ff6b6b; --off:#55606e;
          --act:#FF6B05; --prs:#F2994D; --diff:#EBEBEB; --tabOn:#4D85D9; --tabOff:#29333f; --tabCur:#FFF233; --done:#73E68C; --opp:#ff7373; --rowNow:#26364a; }
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--text); font-family:"Noto Sans KR","Malgun Gothic",sans-serif; }
  body { display:flex; flex-direction:column; padding:10px 16px 10px; gap:10px; }

  /* 위 — 로고 왼쪽 · 타이틀 가운데 */
  header { display:grid; grid-template-columns:1fr auto 1fr; align-items:center; padding-bottom:8px; border-bottom:1px solid var(--line); }
  header img { height:38px; width:auto; display:block; }
  header h1 { margin:0; font-size:24px; font-weight:700; letter-spacing:0.02em; text-align:center; }

  /* 본문 — 크기는 layout()이 잡는다(묶음 높이 = 영상 칸 높이) */
  #stage { flex:1; min-height:0; display:flex; justify-content:center; align-items:flex-start; }
  #grp { display:flex; gap:14px; height:100%; }
  #left { width:420px; flex:none; /* 넓은 창에서는 layout()이 남는 폭을 다 준다(10-22) */ display:flex; flex-direction:column; gap:12px; min-height:0; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:12px; min-height:0; }

  /* 컨트롤러UI — 탭 줄(칸 바탕 · 지금 탭 = 파란 칸 + 노란 글자 · 다 잰 탭 = 초록 글자) + 반투명 테두리 안내 */
  #ctrl { flex:1 1 0; display:flex; flex-direction:column; }
  /* ★11-17 사용자 지시: 헤드셋 컨트롤러UI와 같게 — 탭 줄 홈 = ≡ 아이콘 · 좁은 칸 · 지금 탭 흰색 / 나머지 회색 · 배터리 아이콘 + 숫자 ·
       홈 메뉴 = 목록 상자 + 설명 상자 · 글자 비율 = 실습 UI 규격 20(안내) / 18(탭) / 16(메뉴) / 14(설명 · 알림) / 12(조작 · 배터리) — 기준 20 = 23px */
  #cBattRow { display:flex; justify-content:flex-end; align-items:center; gap:6px; font-size:13.8px; color:var(--dim); margin-bottom:3px; min-height:18px; }
  #cBattRow svg { width:30px; height:16px; display:block; }
  #tabs { display:grid; grid-template-columns:0.5fr 1fr 1fr 1fr; gap:3px; margin-bottom:6px; }
  #tabs button { background:var(--tabOff); color:#A9B0BA; border:0; border-radius:4px; padding:9px 4px; font-size:20.7px; font-family:inherit; cursor:pointer; white-space:nowrap; overflow:hidden; }
  #tabs button svg { width:22px; height:16px; display:block; margin:auto; }
  #tabs button.done { color:var(--done); }
  #tabs button.cur { background:var(--tabOn); color:#F2F3F5; font-weight:700; }
  #guide { flex:1; min-height:0; border:1.5px solid rgba(255,255,255,0.35); border-radius:4px; padding:10px 14px; overflow:hidden; text-align:center;
           display:flex; flex-direction:column; justify-content:center; gap:8px; }
  #gLine { font-size:23px; line-height:1.5; }
  #gLine .sub { font-size:72%; }
  #gNote { font-size:16.1px; color:var(--note); }
  #gNote:empty { display:none; }
  #menu { display:none; gap:8px; text-align:left; }
  #menu.on { display:flex; }
  #mList, #mDesc { border:1px solid rgba(255,255,255,0.28); border-radius:4px; padding:6px 8px; }
  #mList { flex:none; display:flex; flex-direction:column; gap:2px; }
  #mList div { font-size:18.4px; padding:3px 8px; border-radius:3px; color:#F2F3F5; white-space:nowrap; }
  #mList div.cur { background:var(--tabOn); color:#FFF233; font-weight:700; }
  #mDesc { flex:1; font-size:16.1px; line-height:1.45; color:var(--note); }
  #mHint { font-size:13.8px; color:var(--dim); text-align:center; }
  #mHint:empty { display:none; }

  /* 결과(11-17) — 결과 창이 떴을 때 표 위에 제목 · 부제(· 평가 점수) */
  #resHead { display:none; margin-bottom:6px; }
  #resHead.on { display:flex; align-items:center; gap:14px; }
  #resHead .t { font-size:18px; font-weight:700; }
  #resHead .s { font-size:13px; color:var(--dim); }
  #resHead .score { font-size:34px; font-weight:700; color:var(--act); line-height:1; }
  #resHead .score small { font-size:15px; color:var(--text); margin-left:2px; }
  td .base { display:block; font-size:12px; color:var(--dim); line-height:1.1; }
  .chip { display:inline-block; min-width:44px; padding:1px 5px; border-radius:4px; font-size:15px; font-weight:700; background:#1d242e; margin:0 1px; }

  /* 기록UI — 확인(트리거)한 동작만 채운다(헤드셋 결과표와 같다). 줄 높이는 카드 높이를 나눠 쓴다 */
  #result { flex:1.35 1 0; display:flex; padding:6px 12px; }
  table { width:100%; height:100%; border-collapse:collapse; font-variant-numeric:tabular-nums; }
  th { font-size:14px; font-weight:600; padding:5px 4px; border-bottom:1px solid var(--line); }
  th:first-child, td:first-child { text-align:left; padding-left:8px; }
  td { font-size:20px; padding:2px 4px; text-align:center; border-bottom:1px solid #1c232c; }
  tr:last-child td { border-bottom:0; }
  tr.now td { background:var(--rowNow); }
  .a { color:var(--act); } .p { color:var(--prs); } .d { color:var(--diff); } .opp { color:var(--opp); }
  th.n { color:var(--dim); }
  td.n { font-size:18px; }

  /* 미러링 — 현실 영상 + 앱 겹치기. 둘레 여백(PAD)은 고정 · 칸은 영상 비율 그대로. 누르면 화면 전체 */
  #mirror { position:relative; flex:none; background:#000; border:1px solid var(--line); border-radius:10px; overflow:hidden; cursor:zoom-in; }
  #mirror video { position:absolute; inset:var(--pad, 14px); width:calc(100% - 2 * var(--pad, 14px)); height:calc(100% - 2 * var(--pad, 14px)); object-fit:contain; }
  #mirror.big video { inset:0; width:100%; height:100%; }
  #mirror img { position:absolute; inset:var(--pad, 14px); width:calc(100% - 2 * var(--pad, 14px)); height:calc(100% - 2 * var(--pad, 14px)); object-fit:contain; }
  #mirror.big { position:fixed; inset:0 !important; width:auto !important; height:auto !important; z-index:10; border-radius:0; cursor:zoom-out; }
  #mirror.big img { inset:0; width:100%; height:100%; }
  #slow { position:absolute; left:50%; top:calc(var(--pad, 14px) + 10px); transform:translateX(-50%); z-index:2; background:rgba(120,20,20,0.88); color:#fff;
          border:1px solid #ff6b6b; border-radius:6px; padding:8px 14px; font-size:15px; font-weight:600; white-space:nowrap; pointer-events:none; }
  #eCam { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; color:var(--dim); font-size:15px; text-align:center; padding:12px; }

  /* 아래 — 왼쪽 컨트롤러 · 헤드셋 배터리 / 가운데 정보 / 오른쪽 해상도 · CSV */
  footer { display:grid; grid-template-columns:1fr auto 1fr; align-items:center; gap:12px; padding-top:8px; border-top:1px solid var(--line); }
  #devs { display:flex; align-items:center; gap:14px; }
  .ctl { display:flex; flex-direction:column; align-items:center; gap:1px; color:var(--off); font-size:12px; }
  .ctl svg { width:34px; height:34px; display:block; }
  .ctl.on { color:var(--ok); }
  .ctl.on svg { filter:drop-shadow(0 0 4px rgba(60,207,122,0.85)); }
  .ctl b { font-weight:700; font-size:13px; }
  #hmd { display:flex; align-items:center; gap:7px; margin-right:6px; font-size:14px; color:var(--dim); }
  #hmd svg { width:34px; height:18px; display:block; }
  #hmd b { color:var(--text); font-weight:600; }
  #info { display:flex; flex-wrap:wrap; justify-content:center; gap:3px 16px; font-size:13px; color:var(--dim); text-align:center; }
  #info b { color:var(--text); font-weight:600; }
  .dot { display:inline-block; width:8px; height:8px; border-radius:50%; background:var(--bad); margin-right:5px; vertical-align:middle; }
  .dot.on { background:var(--ok); }
  #tools { justify-self:end; display:flex; align-items:center; gap:8px; }
  #sent { font-size:12px; color:var(--dim); }
  select, button.b { background:#1d242e; color:var(--text); border:1px solid #34404f; border-radius:8px; padding:8px 12px; font-size:14px; font-family:inherit; cursor:pointer; white-space:nowrap; }
  button:active { transform:translateY(1px); }
  button.b.recOn { background:#7a1d1d; border-color:#ff6b6b; color:#fff; font-weight:700; }
  button.b.recOn::before { content:""; display:inline-block; width:9px; height:9px; border-radius:50%; background:#ff6b6b; margin-right:7px; vertical-align:middle; animation:blink 1s steps(2) infinite; }
  @keyframes blink { 50% { opacity:0; } }

  /* 모바일(좁은 화면) — 한 줄로 쌓는다. 순서 = 컨트롤러UI → 미러링 → 기록 → 아래 줄 */
  @media (max-width: 900px) {
    html, body { height:auto; }
    body { padding:8px 10px 12px; }
    header img { height:28px; }
    header h1 { font-size:20px; }
    #stage, #grp, #left { display:contents; width:auto !important; }
    body > * { flex:none; }
    #ctrl { order:1; flex:none; } #result { order:2; flex:none; } #mirror { order:3; }   /* 10-21: 컨트롤러UI · 기록은 묶음 — 영상은 그 아래 */
    #mirror { width:100% !important; height:auto !important; aspect-ratio:4 / 3; }
    #result { padding:6px 10px; }
    td { font-size:17px; padding:8px 2px; } td.n { font-size:16px; } th { font-size:13px; }
    #guide { min-height:130px; }
    footer { order:4; grid-template-columns:1fr; justify-items:center; }
    #tools { justify-self:center; }
  }
</style>
</head>

</script>
<script>
const TABS = ['홈', '굴곡·신전', '측굴', '회전'];   // 10-16: 자유 측정 탭은 앱에서 꺼 두었다(top4)
const MOTIONS = ['굴곡', '신전', '우측굴', '좌측굴', '우회전', '좌회전'];   // 헤드셋 결과표와 같은 줄 순서(재는 순서 · 10-16)
const PAD = 14, GAP = 14;   // 영상 둘레 여백 · 묶음과 영상 사이(px, 고정)
const $ = id => document.getElementById(id);
const tabsEl = $('tabs');
// ★11-17: 홈 탭 = ≡ 아이콘(헤드셋 컨트롤러UI · 벽면UI와 같은 막대 3개) · 칸은 좁게(CSS 0.5fr)
const MENU_ICON = '<svg viewBox="0 0 22 16"><rect x="1" y="1" width="20" height="2.6" rx="1" fill="currentColor"/><rect x="1" y="6.7" width="20" height="2.6" rx="1" fill="currentColor"/><rect x="1" y="12.4" width="20" height="2.6" rx="1" fill="currentColor"/></svg>';
TABS.forEach((n, i) => { const b = document.createElement('button'); if (i === 0) { b.innerHTML = MENU_ICON; b.title = '메뉴(홈)'; } else b.textContent = n; b.onclick = () => cmd('top' + i); tabsEl.appendChild(b); });
// 미러링 해상도 — 앱 RomLineMirror.CamChoices와 같은 순서(cam0 · cam1 · 10-23 저녁: 둘만)
const resEl = $('res');
['800x600', '1280x960'].forEach((r, i) => { const o = document.createElement('option'); o.value = i; o.textContent = r.replace('x', ' × '); o.dataset.r = r; resEl.appendChild(o); });
let resPicked = 0;   // 고른 직후 몇 초는 앱이 아직 옛 해상도를 알려 오므로 덮어쓰지 않는다
resEl.onchange = () => { cmd('cam' + resEl.value); resPicked = Date.now(); };
const rowsEl = $('rows');
const cells = MOTIONS.map(n => {
  const tr = document.createElement('tr');
  tr.innerHTML = '<td class="n">' + n + '</td><td class="a">—</td><td class="p">—</td><td class="d">—</td>';
  rowsEl.appendChild(tr);
  return { tr, a: tr.children[1], p: tr.children[2], d: tr.children[3] };
});

// ── 크기 — 영상 칸 = 영상 비율 + 고정 여백. 높이를 먼저 채우고, 폭이 모자라면 폭에 맞춘다. 왼쪽 묶음 높이는 영상 칸과 같다 ──
//   ★10-22 사용자 지시: 창을 최대로 키우면 좌우 여백 · 스크롤이 없어야 한다 → 영상이 높이를 채우고 남는 폭은 왼쪽 묶음이 다 쓴다(최소 LEFT_MIN).
//   종전(10-21)에는 왼쪽이 420px 고정이라 넓은 창에서 묶음 양옆이 비었다(2000px 창에서 좌우 약 245px씩).
const LEFT_MIN = 420;
const stage = $('stage'), grp = $('grp'), mir = $('mirror'), img = $('iCam'), left = $('left');
let aspect = 4 / 3;
function layout() {
  if (window.matchMedia('(max-width: 900px)').matches) { grp.style.height = grp.style.width = mir.style.width = mir.style.height = left.style.width = ''; return; }
  mir.style.setProperty('--pad', PAD + 'px');
  const W = stage.clientWidth, H = stage.clientHeight;
  let h = H - 2 * PAD, w = h * aspect;
  if (LEFT_MIN + GAP + w + 2 * PAD > W) { w = Math.max(0, W - LEFT_MIN - GAP - 2 * PAD); h = w / aspect; }
  const L = Math.max(LEFT_MIN, W - GAP - (w + 2 * PAD));
  left.style.width = L + 'px';
  mir.style.width = (w + 2 * PAD) + 'px';
  mir.style.height = (h + 2 * PAD) + 'px';
  grp.style.height = (h + 2 * PAD) + 'px';
  grp.style.width = W + 'px';
}
window.addEventListener('resize', layout);
layout();

function cmd(c) {
  $('sent').textContent = '보냄: ' + c + ' …';
  fetch('/cmd?c=' + encodeURIComponent(c), { cache: 'no-store' })
    .then(r => { $('sent').textContent = r.ok ? '' : '★보내지 못함: ' + c; })
    .catch(() => { $('sent').textContent = '★보내지 못함(연결 끊김): ' + c; });
}

// 헤드셋 안내 글(TextMeshPro 서식)을 HTML로 — <color=#..> · <size=72%> · 줄바꿈만 쓴다.
function tmp(s) {
  return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/&lt;color=(#[0-9A-Fa-f]{6,8})&gt;/g, '<span style="color:$1">').replace(/&lt;\/color&gt;/g, '</span>')
    .replace(/&lt;size=72%&gt;/g, '<span class="sub">').replace(/&lt;size=([0-9.]+)%&gt;/g, '<span style="font-size:$1%">').replace(/&lt;\/size&gt;/g, '</span>')
    .replace(/&lt;b&gt;/g, '<b>').replace(/&lt;\/b&gt;/g, '</b>')
    .replace(/\n/g, '<br>');
}

function val(cell, r, on) {
  cell.textContent = on && r ? r.v.toFixed(1) + '°' : '—';
  cell.classList.toggle('opp', !!(on && r && r.o));
}

let lastGuide = null, lastNote = null, lastMenu = null;
function poll() {
  fetch('/state', { cache: 'no-store' }).then(r => r.json()).then(s => {
    // 11-13 같은 주소(:8090)를 추나 미러링과 XR-ROM이 번갈아 연다 — 다른 종류의 상태가 오면 그 쪽 페이지로 새로고침
    if (s.page && s.page !== 'rom') { location.reload(); return; }
    $('connBox').style.display = 'none';
    $('track').textContent = s.calib ? '보정 중' : (s.tracked ? '추적 중' : '★놓침');
    if (s.title && $('title').textContent !== s.title) { $('title').textContent = s.title; document.title = s.title; }
    recUser = typeof s.user === 'string' ? s.user : '';
    // 컨트롤러 좌우 — 연결되면 초록 테두리(글자는 L · R만 · 10-21)
    $('cL').classList.toggle('on', !!s.ctrlL);
    $('cR').classList.toggle('on', !!s.ctrlR);

    // 컨트롤러UI — 안내 글은 헤드셋과 같은 글(guide)이고, 없으면(자유 측정 등) 모니터용 한 줄(instruction)
    const g = s.guide !== undefined ? s.guide : (s.instruction || ''), n = s.guide !== undefined ? (s.guideNote || '') : (s.note || '');
    if (g !== lastGuide) { $('gLine').innerHTML = tmp(g); lastGuide = g; }
    if (n !== lastNote) { $('gNote').innerHTML = tmp(n); lastNote = n; }
    const top = typeof s.top === 'number' ? s.top : -1, done = s.tabDone || '000';
    [...tabsEl.children].forEach((b, i) => { b.classList.toggle('cur', i === top); b.classList.toggle('done', i >= 1 && done[i - 1] === '1'); });

    // 홈 메뉴(11-17) — 헤드셋 컨트롤러UI와 같은 목록 · 설명(글은 헤드셋과 같은 TMP 글)
    const mn = s.menu;
    const menuOn = !!(mn && mn.on);
    $('menu').classList.toggle('on', menuOn);
    if (menuOn) {
      const key = JSON.stringify(mn);
      if (key !== lastMenu) {
        lastMenu = key;
        $('mList').innerHTML = (mn.labels || []).map((l, i) => '<div class="' + (i === mn.cur ? 'cur' : '') + '">' + (i === mn.cur ? '▶ ' : '') + l + '</div>').join('');
        $('mDesc').innerHTML = tmp(mn.desc || '');
        $('mHint').textContent = mn.hint || '';
      }
    } else if (lastMenu !== null) { lastMenu = null; $('mHint').textContent = ''; }

    // 기록 — 확인한 동작만 채운다. ★11-17 결과 창이 떴으면 제목 · 부제 · (평가) 점수 · 칸별 «평가 (실습)» · 오차 칩
    const conf = s.confirmed || '000000', res = s.results || [];
    const now = top > 0 && typeof s.cur === 'number' ? s.cur : -1;
    const R = s.result || {};
    const ev = !!(R.on && R.eval && R.cells);
    $('resHead').classList.toggle('on', !!R.on);
    if (R.on) {
      $('rTitle').textContent = R.title || '';
      $('rSub').textContent = R.sub || '';
      $('rScore').innerHTML = ev ? '<div class="score">' + Number(R.score).toFixed(1) + '<small>점</small></div><div class="s">평균 오차 ' + Number(R.mean).toFixed(1) + '° · 비교 ' + R.n + '칸</div>' : '';
    }
    $('thD').textContent = ev ? '오차 능동 / 압박' : '차이';
    const chip = e => e === null || e === undefined ? '<span class="chip" style="color:var(--off)">—</span>'
      : '<span class="chip" style="color:' + (Math.abs(e) <= 2 ? '#73E68C' : Math.abs(e) <= 5 ? '#F2994D' : '#FF7373') + '">' + (e > 0 ? '+' : '') + Number(e).toFixed(1) + '</span>';
    cells.forEach((c, m) => {
      const on = conf[m] === '1', r = res[m] || {};
      if (ev) {
        const ca = R.cells[m * 2] || {}, cp = R.cells[m * 2 + 1] || {};
        const cell = (el, x) => { el.innerHTML = (x.v === null || x.v === undefined ? '—' : Number(x.v).toFixed(1) + '°') + (x.b === null || x.b === undefined ? '' : '<span class="base">(실습 ' + Number(x.b).toFixed(1) + ')</span>'); el.classList.remove('opp'); };
        cell(c.a, ca); cell(c.p, cp);
        c.d.innerHTML = chip(ca.e) + chip(cp.e);
      } else {
        val(c.a, r.a, on); val(c.p, r.p, on);
        c.d.textContent = on && r.a && r.p ? ((x => (x > 0 ? '+' : '') + x.toFixed(1))(r.p.v - r.a.v)) + '°' : '—';
      }
      c.tr.classList.toggle('now', m === now && !R.on);
    });
  }).catch(() => { $('conn').textContent = '★연결 끊김'; $('connBox').style.display = ''; })
    .finally(() => setTimeout(poll, 300));
}
poll();

// 미러링 — 받자마자 다음 장을 묻는다. 헤드셋이 만드는 속도만큼만 오고 쌓이지 않는다.
// ★10-21: 브라우저가 실제로 받은 장수와 한 장 받는 시간(요청 → 다 받음)을 잰다 — 헤드셋이 만든 장수와 차이가 나면 와이파이 쪽이다.
let got = 0, gotMs = 0, gotBytes = 0;
let mode = 'jpeg';   // 'jpeg' = 사진을 한 장씩(/cam.jpg) · 'video' = 영상(H.264, 헤드셋 :videoPort/video)
const jpegLoop = (function stream() {
  const empty = $('eCam');
  let url = null, running = false;
  function load() {
    if (mode !== 'jpeg') { running = false; return; }   // 영상으로 넘어가면 사진 요청을 멈춘다 — 3초 뒤 헤드셋도 JPEG 압축을 멈춘다
    running = true;
    const t0 = performance.now();
    fetch('/cam.jpg?t=' + Date.now(), { cache: 'no-store' }).then(r => {
      if (!r.ok) throw r.status;
      return r.blob();
    }).then(b => {
      got++; gotMs += performance.now() - t0;
      const u = URL.createObjectURL(b);
      img.onload = () => {
        if (url) URL.revokeObjectURL(url); url = u; empty.style.display = 'none';
        const a = img.naturalWidth / img.naturalHeight;
        if (a > 0 && Math.abs(a - aspect) > 0.01) { aspect = a; layout(); }
        setTimeout(load, 10);
      };
      img.src = u;
    }).catch(() => { if (mode === 'jpeg') empty.style.display = 'flex'; setTimeout(load, 1000); });
  }
  load();
  return { resume() { if (!running) load(); } };
})();

// ── 영상(H.264) — 10-21 사용자 지시: 배터리 · 발열을 줄이려 JPEG 대신 헤드셋 하드웨어 압축 ──
//   헤드셋(RomVideoEncoder)이 :videoPort/video로 Annex-B 스트림을 흘린다 → 접근 단위(한 장)로 잘라 jmuxer가 MSE(<video>)에 넣는다.
//   첫 장이 5초 안에 안 오거나 끊기면 사진(JPEG)으로 돌아간다. 장이 한 번도 안 온 실패가 3번 이어지면 다시 시도하지 않는다.
const vid = $('vCam');
let videoPort = 0, videoTry = null, videoFails = 0, videoRetry = null;
function startVideo() {
  // ★11-10 실패 3번 뒤에도 10초마다 다시 시도(헤드셋 앱이 다시 켜지면 영상으로 돌아오게 · 추나 미러와 같은 규칙)
  if (!videoTry && videoPort && videoFails >= 3) { if (!videoRetry) videoRetry = setTimeout(() => { videoRetry = null; videoFails = 2; startVideo(); }, 10000); return; }
  if (videoTry || !videoPort || videoFails >= 3 || !window.MediaSource || typeof JMuxer === 'undefined') return;
  const jm = new JMuxer({ node: vid, mode: 'video', flushingTime: 0, fps: 15, clearBuffer: true, debug: false, onError: () => {} });
  const ctrl = new AbortController();
  let frames = 0, last = 0, ended = false;
  videoTry = { stop };
  const watchdog = setTimeout(() => { if (!frames) stop('첫 장 없음'); }, 5000);
  // ★11-13 기기에서 잡음: 앱이 다시 켜진 뒤 다시 붙으면 장은 계속 받는데(15장/s) 재생기가 한 장도 못 그리는(readyState 0) 채 멈췄다 — 새로고침하면 풀렸다.
  //   → 20장 넘게 받았는데 4초째 아무것도 못 그리면 끊고 처음부터 다시 붙는다(새 재생기 · 새 연결).
  let blankSec = 0;
  const decodeDog = setInterval(() => { blankSec = frames > 20 && vid.readyState === 0 ? blankSec + 1 : 0; if (blankSec >= 4) stop('받는데 안 그려짐'); }, 1000);
  function stop(why) {
    if (ended) return;
    ended = true;
    clearTimeout(watchdog);
    clearInterval(decodeDog);
    try { ctrl.abort(); } catch (e) { }
    try { jm.destroy(); } catch (e) { }
    if (!frames) videoFails++; else videoFails = 0;
    videoTry = null;
    if (mode === 'video') { mode = 'jpeg'; vid.style.display = 'none'; img.style.display = ''; jpegLoop.resume(); }
    $('mmode').textContent = '사진';
    console.log('[미러링] 영상 멈춤 — ' + why + ' · 받은 장 ' + frames);
    setTimeout(startVideo, 1500);   // 해상도를 바꾸면 헤드셋이 끊는다 — 새 크기로 다시 붙는다
  }
  // 헤드셋은 한 장(Annex-B 접근 단위)마다 앞에 길이 4바이트(빅엔디언)를 붙여 보낸다(10-21) — 다 받는 즉시 튼다.
  //   (종전: 시작 부호로 잘라 «다음 장이 와야» 앞 장을 넘겼다 — 한 장(약 0.07초) 늦었다)
  let pend = new Uint8Array(0);
  function emit(out) {
    const t = performance.now(), d = last ? Math.min(300, Math.max(20, t - last)) : 66;
    last = t;
    jm.feed({ video: out, duration: d });
    frames++; got++;
    if (frames === 1) {
      mode = 'video'; img.style.display = 'none'; vid.style.display = ''; $('eCam').style.display = 'none';
      $('mmode').textContent = '영상';
    }
  }
  function push(chunk) {
    let b = chunk;
    if (pend.length) { b = new Uint8Array(pend.length + chunk.length); b.set(pend); b.set(chunk, pend.length); }
    let o = 0;
    while (b.length - o >= 4) {
      const len = ((b[o] << 24) | (b[o + 1] << 16) | (b[o + 2] << 8) | b[o + 3]) >>> 0;
      if (len === 0 || len > 8000000) throw new Error('길이 이상 ' + len);   // 형식이 어긋났다(옛 헤드셋 앱 등) → 사진으로 돌아간다
      if (b.length - o - 4 < len) break;
      emit(b.slice(o + 4, o + 4 + len));
      o += 4 + len;
    }
    pend = b.slice(o);
  }
  fetch('http://' + location.hostname + ':' + videoPort + '/video', { cache: 'no-store', signal: ctrl.signal }).then(r => {
    if (!r.ok || !r.body) throw r.status;
    const rd = r.body.getReader();
    const pump = () => rd.read().then(({ done, value }) => {
      if (done) { stop('스트림 끝'); return; }
      gotBytes += value.length;
      push(value);
      return pump();
    });
    return pump();
  }).catch(e => stop('연결 실패 ' + e));
  vid.play().catch(() => { });
}
// 지연이 쌓이지 않게(10-21 사용자: «살짝 지연») — 받아 놓고 안 튼 분량이 0.12초를 넘으면 재생을 빠르게 해 따라잡는다(최대 1.5배 · 끊김 없이).
//   1초 넘게 밀리면(탭이 뒤에 있었다 등) 끝으로 건너뛴다. 종전엔 0.4초까지 그냥 두어 0.2~0.3초가 늘 쌓여 있었다(기기 실측).
setInterval(() => {
  if (mode !== 'video' || !vid.buffered.length) return;
  const end = vid.buffered.end(vid.buffered.length - 1), lag = end - vid.currentTime;
  if (lag > 1.0) { vid.currentTime = Math.max(0, end - 0.03); vid.playbackRate = 1; }
  else vid.playbackRate = lag > 0.12 ? Math.min(1.5, 1 + (lag - 0.06) * 3) : 1;
  if (vid.paused) vid.play().catch(() => { });
}, 200);
vid.addEventListener('resize', () => {
  const a = vid.videoWidth / vid.videoHeight;
  if (a > 0 && Math.abs(a - aspect) > 0.01) { aspect = a; layout(); }
});
// ★10-21 사용자 지시: 받은 장수가 5장/s 이하로 3초 이어지면 영상 위에 경고. 헤드셋이 만든 장수도 낮으면 헤드셋 쪽, 아니면 와이파이 쪽이다.
const SLOW_FPS = 5, SLOW_SEC = 3;
let headFps = -1, slowSec = 0, everGot = false;
setInterval(() => {
  $('rfps').textContent = got.toFixed(0) + '장/s';
  if (mode === 'video') { $('rlab').textContent = '받는 양'; $('rms').textContent = (gotBytes * 8 / 1e6).toFixed(2) + 'Mbps'; }
  else { $('rlab').textContent = '한 장'; $('rms').textContent = got ? (gotMs / got).toFixed(0) + 'ms' : '—'; }
  gotBytes = 0;
  if (got > 0) everGot = true;
  const waiting = $('eCam').style.display !== 'none';   // 영상이 아예 안 오면 «기다리는 중»이 이미 떠 있다
  slowSec = everGot && !waiting && got <= SLOW_FPS ? slowSec + 1 : 0;
  const w = $('slow');
  if (slowSec >= SLOW_SEC) {
    w.textContent = '⚠ 미러링이 느립니다 (' + got + '장/s) — ' +
      (headFps >= 0 && headFps <= SLOW_FPS ? '헤드셋 상태를 확인하세요' : '와이파이 상태를 확인하세요');
    w.style.display = '';
  } else w.style.display = 'none';
  got = 0; gotMs = 0;
}, 1000);
mir.onclick = () => mir.classList.toggle('big');

// ── 영상 녹화(10-22 사용자 지시) — 이 PC(브라우저 다운로드 폴더)에 저장한다. 헤드셋은 하는 일이 없다(배터리 · 발열 그대로).
//   미러링 칸에 보이는 그대로(영상 · 사진 어느 방식이든)를 캔버스에 15장/s로 옮겨 MediaRecorder로 담는다 — 영상 방식이 사진으로 바뀌어도 이어진다.
//   [영상 녹화] → [녹화중](빨강) → 한 번 더 누르면 끝내고 저장. 파일 이름 = 실습명_사용자명(없으면 뺌)_날짜_시각.
const recBtn = $('rec');
let rec = null, recChunks = [], recCanvas = null, recCtx = null, recTimer = 0, recUser = '', recStart = null, recType = '';
function recSrc() {
  if (vid.style.display !== 'none' && vid.videoWidth > 0) return { el: vid, w: vid.videoWidth, h: vid.videoHeight };
  if (img.naturalWidth > 0) return { el: img, w: img.naturalWidth, h: img.naturalHeight };
  return null;
}
function recName(ext, when) {
  const d = when || recStart, p = n => String(n).padStart(2, '0');
  const parts = [$('title').textContent || '미러링'];
  if (recUser) parts.push(recUser);
  parts.push(d.getFullYear() + p(d.getMonth() + 1) + p(d.getDate()) + '_' + p(d.getHours()) + p(d.getMinutes()) + p(d.getSeconds()));
  return parts.map(x => x.replace(/[\\/:*?"<>|\s]+/g, '')).join('_') + '.' + ext;
}
function recBegin() {
  const src = recSrc();
  if (!src) { $('sent').textContent = '★녹화 못 함 — 미러링 영상이 아직 없다'; return; }
  if (!window.MediaRecorder) { $('sent').textContent = '★녹화 못 함 — 이 브라우저는 녹화를 지원하지 않는다'; return; }
  recCanvas = document.createElement('canvas');
  recCanvas.width = src.w; recCanvas.height = src.h;   // 시작 때 크기로 고정 — 도중에 해상도를 바꾸면 그 크기로 늘여 그린다
  recCtx = recCanvas.getContext('2d');
  recType = ['video/mp4;codecs=avc1', 'video/mp4', 'video/webm;codecs=vp9', 'video/webm'].find(t => MediaRecorder.isTypeSupported(t)) || '';
  rec = new MediaRecorder(recCanvas.captureStream(15), recType ? { mimeType: recType, videoBitsPerSecond: 4000000 } : { videoBitsPerSecond: 4000000 });
  recChunks = [];
  rec.ondataavailable = e => { if (e.data && e.data.size) recChunks.push(e.data); };
  rec.onstop = recSave;
  recStart = new Date();
  recTimer = setInterval(() => { const s = recSrc(); if (s) recCtx.drawImage(s.el, 0, 0, recCanvas.width, recCanvas.height); }, 1000 / 15);
  rec.start(1000);   // 1초마다 조각을 받아 둔다(끝에 한 번에 받으면 긴 녹화에서 멈칫한다)
  recBtn.textContent = '녹화중'; recBtn.classList.add('recOn');
  console.log('[관제] 녹화 시작 —', recType || '(기본 형식)', recCanvas.width + '×' + recCanvas.height);
}
function recSave() {
  clearInterval(recTimer);
  const ext = recType.indexOf('mp4') >= 0 ? 'mp4' : 'webm';
  const blob = new Blob(recChunks, { type: recType || 'video/webm' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = recName(ext);
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 60000);
  $('sent').textContent = '저장: ' + a.download + ' (' + (blob.size / 1048576).toFixed(1) + ' MB)';
  console.log('[관제] 녹화 저장 —', a.download, blob.size, 'bytes');
  rec = null; recChunks = []; recCanvas = recCtx = null;
  recBtn.textContent = '영상 녹화'; recBtn.classList.remove('recOn');
}
recBtn.onclick = () => { if (rec) rec.stop(); else recBegin(); };

// ── 측정값 저장(10-22 사용자 지시) — 결과표 값만(헤드셋이 /csv로 준다). 파일 이름은 녹화와 같은 꼴: 실습명_사용자명(없으면 뺌)_날짜_시각.csv
$('saveCsv').onclick = async () => {
  try {
    const r = await fetch('/csv', { cache: 'no-store' });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const blob = await r.blob();
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = recName('csv', new Date());
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 60000);
    $('sent').textContent = '저장: ' + a.download;
  } catch (e) { $('sent').textContent = '★측정값을 못 받았다 — ' + e.message; }
};

// 헤드셋 배터리(10-21) — 구간 색은 헤드셋 RomLineView.BatteryBand와 같다: 50% 초과 초록 · 20% 초과 노랑 · 20% 이하 빨강
function batt(m) {
  // ★11-17: 아래 줄(헤드셋 배터리)과 컨트롤러UI 위 배터리(아이콘 + 숫자 — 헤드셋 컨트롤러UI와 같다)를 같이 칠한다
  [['batt', 'bFill', true], ['cBatt', 'cbFill', false]].forEach(([ei, fi, long]) => {
    const e = $(ei), f = $(fi);
    if (!e || !f) return;
    if (m.battery === undefined || m.battery < 0) { e.textContent = '—'; e.style.color = ''; f.setAttribute('width', 0); return; }
    const c = m.battery > 50 ? '#73E68C' : m.battery > 20 ? '#FFF233' : '#FF6B6B';
    e.textContent = m.battery + '%' + (m.charging ? (long ? ' · 충전 중' : ' 충전') : '');
    e.style.color = c;
    f.setAttribute('width', (22 * m.battery / 100).toFixed(1)); f.setAttribute('fill', c);
  });
}
function info() {
  fetch('/mirrorinfo', { cache: 'no-store' }).then(r => r.json()).then(m => {
    if (m.wallFps === undefined) return;
    $('cfps').textContent = m.camSupported ? m.camFps + '장/s' : '지원 안 함';
    headFps = m.camSupported ? +m.camFps : -1;
    if (m.videoPort && !videoPort) { videoPort = m.videoPort; startVideo(); }   // 헤드셋이 영상 포트를 열었으면 영상으로 바꾼다
    $('afps').textContent = m.appFps + 'fps';
    batt(m);
    $('camState').textContent = m.camState || '';
    if (Date.now() - resPicked > 8000) [...resEl.options].forEach(o => { if (o.dataset.r === m.camRes) resEl.value = o.value; });
    if (!m.camSupported) $('eCam').textContent = '현실 영상 지원 안 함 — ' + (m.camState || '');
  }).catch(() => {}).finally(() => setTimeout(info, 1000));
}
info();
</script>
</body>
</html>
