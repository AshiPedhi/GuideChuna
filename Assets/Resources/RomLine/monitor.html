<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>선 실측 모니터</title>
<!--
  경추 ROM «선 실측» — 모니터 화면(2026-10-07 신설).
  헤드셋을 쓰지 않고 정해 둔 자리에 놓은 채 컨트롤러만으로 잴 때, 같은 Wi-Fi의 PC·태블릿 브라우저로 여는 화면이다.
  헤드셋 앱(RomLineMonitor)이 이 파일을 그대로 내보내고, 이 화면은 /state 를 0.15초마다 물어 그린다. 버튼은 /cmd?c=… 로 보낸다.
  주소 끝에 #demo 를 붙이면 헤드셋 없이 견본 값으로 그린다(배치 확인용).
  #demo = 굴곡·신전 · #demo-lat = 측굴 · #demo-rot = 회전. 견본에서는 위쪽 탭을 눌러도 바뀐다(10-08).
  10-12: 순서 탭(굴곡 · 신전 · 측굴 · 회전)의 왼쪽은 결과표다 — 측정 명칭 · 능동 · 압박 · 그 동작의 단면에서 본 각도기.
         헤드셋 안의 메인 화면과 같은 값이다.
  10-12 저녁: 탭은 다섯 — 굴곡 · 신전 / 측굴 / 회전 / 리셋 / 자유 측정. 헤드셋에서는 «탭 창»(A 버튼)으로 따로 뜬다.
         탭을 재는 중이면 다른 탭으로 못 간다. 동작 하나(중립 · 능동 · 압박)를 다 찍으면 멈추고 «확인»(트리거 · 아래 버튼)을 기다린다 — 헤드셋의 결과표는 확인해야 채워진다.
         #demo-confirm = 확인을 기다리는 견본 · #demo-popup = 탭 창을 띄운 견본.
-->
<style>
  :root { --bg:#0E1319; --card:#171E27; --line:#2A3542; --ink:#E9EEF4; --dim:#9AA8B8; --sag:#66B3FF; --front:#73E68C; --floor:#FFD94D; --warn:#FFD94D; --note:#CCDBED; --bad:#FF6B6B; --ok:#4ADE80; --neutral:#EBEBEB; --active:#FF6B05; --pressure:#F2994D; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--ink); font-family:'Malgun Gothic','Noto Sans KR',sans-serif; }
  body { display:grid; grid-template-rows:auto 1fr auto; gap:10px; padding:12px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; }
  header { display:grid; grid-template-columns:auto 1fr auto; gap:14px; align-items:center; padding:10px 14px; }
  .tabs { display:flex; gap:8px; }
  .tab { padding:10px 22px; border-radius:8px; background:#222C38; color:var(--dim); font-size:22px; font-weight:700; cursor:pointer; border:2px solid transparent; }
  .tab.on { color:#0E1319; }
  .tab small { font-size:13px; font-weight:400; margin-left:6px; opacity:.8; }
  .tab.sub { padding:8px 14px; font-size:17px; }
  .tab.locked { opacity:.35; cursor:not-allowed; } .tab.reset { color:#FFB4B4; background:#3A1D1D; }
  .tab.cursor { border-color:#FFD94D; }
  .tabs .gap { width:10px; }
  #instruction { font-size:28px; font-weight:700; color:#FFF2A6; }
  #note { font-size:16px; color:var(--note); min-height:22px; }
  #track { font-size:22px; font-weight:800; padding:10px 18px; border-radius:8px; white-space:nowrap; }
  #track.ok { background:#123B22; color:var(--ok); } #track.bad { background:#4A1616; color:var(--bad); } #track.off { background:#333; color:#bbb; }
  main { display:grid; grid-template-columns:minmax(420px, 44%) 1fr; gap:10px; min-height:0; }
  #left { display:grid; grid-template-rows:auto 1fr; gap:10px; min-height:0; }
  #big { padding:14px 18px; display:grid; grid-template-columns:1fr auto; align-items:end; gap:10px; }
  #bigLabel { font-size:17px; color:var(--dim); }
  #bigValue { font-size:84px; font-weight:800; line-height:1; letter-spacing:-1px; }
  #bigSub { font-size:20px; color:var(--dim); text-align:right; }
  #bigWarn { font-size:22px; color:var(--warn); font-weight:700; text-align:right; }
  #tableWrap { overflow:auto; padding:6px 10px; }
  table { width:100%; border-collapse:collapse; font-size:20px; }
  th { text-align:right; color:var(--dim); font-weight:600; font-size:15px; padding:6px 8px; border-bottom:1px solid var(--line); position:sticky; top:0; background:var(--card); }
  th:first-child, td:first-child { text-align:left; }
  td { text-align:right; padding:7px 8px; border-bottom:1px solid #222B36; font-variant-numeric:tabular-nums; white-space:nowrap; }
  tr.ref td { color:var(--dim); } tr.last td { background:#1F2936; font-weight:700; }
  td.plane { font-weight:700; } td.warn { color:var(--warn); text-align:left; font-size:16px; }
  #views { display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px; min-height:0; }
  .view { position:relative; min-height:0; border:2px solid var(--line); border-radius:10px; overflow:hidden; background:#10161D; }
  .view.on { border-width:3px; }
  .view h3 { position:absolute; left:10px; top:6px; margin:0; font-size:16px; font-weight:700; }
  .view h3 small { color:var(--dim); font-weight:400; margin-left:6px; font-size:13px; }
  canvas { width:100%; height:100%; display:block; }
  footer { display:grid; grid-template-columns:1fr auto; gap:12px; align-items:center; padding:8px 12px; }
  #keys { font-size:14px; color:var(--dim); line-height:1.6; }
  #keys b { color:var(--ink); }
  .btns { display:flex; gap:6px; flex-wrap:wrap; justify-content:flex-end; }
  button, a.btn { font:inherit; font-size:15px; padding:8px 12px; border-radius:7px; border:1px solid var(--line); background:#222C38; color:var(--ink); cursor:pointer; text-decoration:none; }
  button:hover, a.btn:hover { background:#2C3A4B; } button.on { background:#2A5FA8; }
  #conn { font-size:13px; color:var(--dim); }
  /* 순서 탭의 결과표(10-12) — «기타»(자유 측정)에서는 종전의 큰 값 + 선 목록이 선다 */
  #gLeft { display:none; grid-row:1 / span 2; overflow:auto; padding:6px 12px; }
  body.guided #gLeft { display:block; } body.guided #big, body.guided #tableWrap { display:none; }
  #res td { padding:2px 8px; font-size:34px; font-weight:800; vertical-align:middle; }
  #res td:first-child { font-size:26px; } #res td:first-child small { display:block; font-size:13px; font-weight:400; color:#667; }
  #res td:first-child em { font-style:normal; font-size:14px; font-weight:700; color:var(--front); margin-left:8px; }
  #bConfirm { display:none; background:#1F7A3F; border-color:#2FA85A; font-weight:800; } #bConfirm.on { display:inline-block; }
  #popTabs { display:flex; gap:8px; justify-content:center; margin-bottom:14px; }
  #popAsk { display:none; margin:10px 0; padding:12px; border-radius:8px; background:#4A1616; color:#FFD0D0; text-align:center; font-size:20px; font-weight:700; } #popAsk.on { display:block; }
  #res td.a { color:var(--active); } #res td.p { color:var(--pressure); } #res td.opp { color:var(--bad); } #res td.none { color:#445; font-weight:400; }
  #res tr.now td { background:#1F2936; } #res tr.now td.cur { text-decoration:underline; text-underline-offset:6px; }
  #res td.g { text-align:center; padding:1px 8px; } #res canvas { width:176px; height:92px; display:block; margin:0 auto; }
  #pop { display:none; position:fixed; inset:0; background:rgba(0,0,0,.6); align-items:center; justify-content:center; z-index:5; }
  #pop.on { display:flex; }
  #popCard { min-width:560px; padding:22px 30px; border-color:#3C4B5E; }
  #popCard h2 { margin:0 0 12px; font-size:26px; text-align:center; }
  .prow { display:grid; grid-template-columns:120px 1fr; align-items:center; padding:7px 12px; border-radius:8px; font-size:24px; }
  .prow.now { background:#1F2936; } .prow b.name { font-weight:700; }
  .prow span.todo { color:#8A96A6; } .prow span.done { color:var(--front); } .prow span.cur { color:var(--floor); font-weight:800; } .prow i { color:#556; font-style:normal; margin:0 12px; }
  #popHint { margin-top:10px; text-align:center; color:var(--note); font-size:17px; min-height:24px; }
  #popProg { text-align:center; font-size:22px; font-weight:700; margin:6px 0 12px; }
  #popKeys { text-align:center; color:var(--dim); font-size:15px; line-height:1.7; }
  #popBtns { display:flex; gap:8px; justify-content:center; margin-top:14px; }
</style>
</head>
<body>
<header class="card">
  <div class="tabs" id="tabs"></div>
  <div><div id="instruction">연결하는 중…</div><div id="note"></div></div>
  <div id="track" class="off">컨트롤러 —</div>
</header>
<main>
  <div id="left">
    <div id="big" class="card">
      <div><div id="bigLabel">가장 최근 측정선</div><div id="bigValue">—</div></div>
      <div><div id="bigWarn"></div><div id="bigSub"></div></div>
    </div>
    <div id="tableWrap" class="card">
      <table><thead><tr><th>선</th><th>길이</th><th id="thPlane">면 각</th><th>직접 각</th><th style="text-align:left">알림</th></tr></thead><tbody id="rows"></tbody></table>
    </div>
    <div id="gLeft" class="card">
      <table id="res"><thead><tr><th>측정</th><th>능동</th><th>압박</th><th style="text-align:center">각도기(단면에서 본 그림)</th></tr></thead><tbody id="resRows"></tbody></table>
    </div>
  </div>
  <div id="views">
    <div class="view" id="v0"><h3 style="color:var(--sag)">옆에서 본 그림<small>굴곡 · 신전</small></h3><canvas></canvas></div>
    <div class="view" id="v1"><h3 style="color:var(--front)">앞에서 본 그림<small>측굴</small></h3><canvas></canvas></div>
    <div class="view" id="v2"><h3 style="color:var(--floor)">위에서 본 그림<small>회전</small></h3><canvas></canvas></div>
  </div>
</main>
<footer class="card">
  <div>
    <div id="keys"></div>
    <div id="conn"></div>
  </div>
  <div class="btns">
    <button id="bConfirm" onclick="cmd('confirm')">확인 → 다음</button>
    <button id="bPopup" onclick="cmd('popup')">탭 창</button>
    <button onclick="cmd('undo')">직선 취소</button>
    <button id="bRebase" onclick="cmd('rebase')">기준선 바꾸기</button>
    <button id="bClear" onclick="if(confirm(this.textContent + ' — 찍은 것을 지울까요?'))cmd('clear')">이 탭 지우기</button>
    <button onclick="if(confirm('전체 측정 결과를 지울까요? (순서 측정과 자유 측정 전부)'))cmd('resetAll')">전체 리셋</button>
    <button onclick="if(confirm('지금 헤드셋이 보는 방향으로 축을 다시 잡을까요? (메인 화면은 그대로 둡니다)'))cmd('axes')" title="헤드셋이 지금 보는 방향으로 잡는다">축 다시 잡기</button>
    <button id="bCalib" onclick="cmd('calib')">끝점 보정</button>
    <a class="btn" href="/csv" download>CSV 받기</a>
    <button onclick="if(confirm('측정을 끝내고 로비로 나갈까요?'))cmd('exit')">나가기</button>
  </div>
</footer>
<div id="pop" onclick="if(event.target===this)cmd('popup')">
  <div class="card" id="popCard">
    <h2>탭 창</h2>
    <div id="popTabs"></div>
    <div id="popAsk">전체 측정 결과를 지울까요?  A = 지우기 · B = 취소</div>
    <div id="popRows"></div>
    <div id="popHint"></div>
    <div id="popProg"></div>
    <div id="popKeys"></div>
    <div id="popBtns"><button onclick="cmd('popup')">닫기</button></div>
  </div>
</div>
<script>
const COLORS = ['#66B3FF', '#73E68C', '#FFD94D'];
// 역할마다 색 하나(10-12) — 헤드셋 안(RomLineView의 NeutralColor · ActiveColor · PressureColor)과 같은 값이다.
const C_NEUTRAL = '#EBEBEB', C_ACTIVE = '#FF6B05', C_PRESSURE = '#F2994D';
const DEMO = location.hash.startsWith('#demo');
let demoTab = location.hash === '#demo-lat' ? 1 : location.hash === '#demo-rot' ? 2 : 0;
let S = null, lastOk = 0, demoPopup = location.hash.endsWith('-popup'), demoConfirm = location.hash.endsWith('-confirm');

// 결과표 · 각도기(10-12) — 헤드셋 안의 판(RomLineView)과 같은 순서 · 같은 방향이다.
//   굴곡 · 신전 = 옆에서 본 그림(오른쪽이 환자 앞) · 측굴 = 앞에서 본 그림(환자 오른쪽이 그림 왼쪽) · 회전 = 위에서 본 그림(아래가 환자 앞)
const MOTIONS = ['굴곡', '신전', '우측굴', '좌측굴', '우회전', '좌회전'], PHASES = ['중립', '능동', '압박'];
const GVIEW = ['옆에서 본 그림', '옆에서 본 그림', '앞에서 본 그림', '앞에서 본 그림', '위에서 본 그림', '위에서 본 그림'];
const GZERO = [1, 1, 1, 1, -1, -1], GSIDE = [1, -1, -1, 1, -1, 1];   // 0° 선이 향하는 쪽(위 +1) · 제 방향으로 움직였을 때 기우는 쪽(오른쪽 +1)
const GLEFT = ['뒤', '뒤', '우', '우', '우', '우'], GRIGHT = ['앞', '앞', '좌', '좌', '좌', '좌'];
const GMAX = 100;   // 이보다 큰 각은 그림에서 여기까지만 그린다 — 숫자는 그대로 나온다
const KEYS_GUIDED = '<b>트리거</b> 점 찍기 · <b>A</b> 탭 창 열기 · 닫기 · 세 직선을 다 찍은 뒤 <b>트리거</b> = 확인 · <b>B</b> 직선 취소(길게 누르면 이 탭 지우기) · <b>스틱 좌우</b> 탭 창을 띄운 동안 탭 고르기 · <b>스틱 누르고 밀기</b> 축 다시 잡기(헤드셋이 보는 방향)';
const KEYS_FREE = '<b>트리거</b> 점 찍기 · <b>A</b> 탭 창 열기 · 닫기 · <b>B</b> 취소(길게 누르면 이 방식의 점 지우기) · <b>스틱 좌우</b> 방식 바꾸기 — 3점 · 4점 · 연속(탭 창을 띄운 동안에는 탭 고르기) · <b>스틱 누르고 밀기</b> 축 다시 잡기(헤드셋이 보는 방향)';

function cmd(c) {
  if (!DEMO) { fetch('/cmd?c=' + encodeURIComponent(c)).catch(() => {}); return; }
  if (/^top[0-2]$/.test(c)) { demoTab = +c[3]; poll(); }   // 견본에서는 탭만 바뀐다
  if (c === 'popup') { demoPopup = !demoPopup; poll(); }
  if (c === 'confirm') { demoConfirm = false; poll(); }
}

// 견본 값 — 좌표는 [환자 오른쪽, 위, 환자 앞](m). 선마다 a = 첫 점, b = 둘째 점.
//   굴곡·신전 · 측굴 = 정중선(미간 → 턱), 회전 = 왼쪽 귀 → 미간. 각은 이 좌표에 맞춰 손으로 적은 값이다(실측 아님).
const DEMO_SETS = [
  { plane:'옆면', instruction:'굴곡 · 압박 — 측정이 끝났습니다', tip:[0.03, 0.86, 0.12],
    lines:[ {n:1, ref:true, refOf:1, len:92, plane:'', direct:0, warn:'', a:[0,0.86,0.02], b:[0.004,0.768,0.015]},
            {n:2, ref:false, refOf:1, len:90, plane:'굴곡 26.8°', direct:26.9, warn:'', a:[-0.001,0.82,0.075], b:[0.002,0.74,0.035]},
            {n:3, ref:false, refOf:1, len:88, plane:'굴곡 39.3°', direct:39.5, warn:'', a:[-0.005,0.78,0.105], b:[0.02,0.71,0.05]} ] },
  { plane:'앞면', instruction:'좌측굴 · 압박 — 측정이 끝났습니다', tip:[-0.09, 0.84, 0.05],
    lines:[ {n:1, ref:true, refOf:1, len:92, plane:'', direct:0, warn:'', a:[0,0.86,0.02], b:[0.004,0.768,0.015]},
            {n:2, ref:false, refOf:1, len:90, plane:'좌측굴 20.0°', direct:20.3, warn:'', a:[-0.045,0.845,0.02], b:[-0.014,0.760,0.016]},
            {n:3, ref:false, refOf:1, len:90, plane:'좌측굴 33.0°', direct:33.2, warn:'', a:[-0.074,0.8305,0.02], b:[-0.025,0.755,0.016]} ] },
  { plane:'바닥면', instruction:'우회전 · 압박 — 측정이 끝났습니다', tip:[0.09, 0.87, 0.07],
    lines:[ {n:1, ref:true, refOf:1, len:146, plane:'', direct:0, warn:'', a:[-0.075,0.80,-0.02], b:[0,0.86,0.09]},
            {n:2, ref:false, refOf:1, len:146, plane:'우회전 30.0°', direct:27.3, warn:'', a:[-0.075,0.80,0.0202], b:[0.045,0.86,0.0779]},
            {n:3, ref:false, refOf:1, len:146, plane:'우회전 55.0°', direct:49.8, warn:'', a:[-0.0594,0.80,0.0499], b:[0.0737,0.86,0.0516]} ] } ];

function demoState() {
  const t = Date.now() / 1000, w = Math.sin(t) * 0.01, d = DEMO_SETS[demoTab];
  const names = ['중립', '능동', '압박'];
  d.lines.forEach((l, i) => { l.name = names[i]; });
  // 결과표의 견본 — 손으로 적은 값이다(실측 아님). 지금 탭의 동작은 위 선들의 값과 맞춘다.
  const R = (a, p) => ({ a:{v:a, o:false}, p:{v:p, o:false} });
  const cur = [0, 3, 4][demoTab];
  const conf = demoConfirm;
  return { popup:demoPopup, cursor:demoTab, locked:conf, confirm:conf, resetAsk:false, confirmed:conf ? ['000000', '111000', '111100'][demoTab] : '111110',
    cur:cur, phase:2, index:0, hint:'측정자가 같은 방향으로 조금 더 눌러 준 자세', steps:conf ? ['111000000000000000', '111111111111000000', '111111111111111000'][demoTab] : '111111111111111111',
    results:conf ? [R(26.8, 39.3), demoTab > 0 ? R(41.5, 52.0) : {a:null, p:null}, demoTab > 0 ? R(22.4, 30.1) : {a:null, p:null}, demoTab > 0 ? R(20.0, 33.0) : {a:null, p:null}, demoTab > 1 ? R(30.0, 55.0) : {a:null, p:null}, {a:null, p:null}]
                 : [R(26.8, 39.3), R(41.5, 52.0), R(22.4, 30.1), R(20.0, 33.0), R(30.0, 55.0), R(48.2, 61.7)],
    mode:'guided', top:demoTab, topTabs:['굴곡 · 신전','측굴','회전','리셋','자유 측정'], tab:demoTab, tabs:['굴곡·신전','측굴','회전'], counts:[0,0,0],
    instruction:conf ? ['굴곡을 다 쟀습니다 — 트리거 = 확인 → 신전', '좌측굴을 다 쟀습니다 — 트리거 = 확인 → 회전', '우회전을 다 쟀습니다 — 트리거 = 확인 → 좌회전'][demoTab] : d.instruction,
    note:conf ? '고치려면  B = 직선 취소 · B 길게 = 이 탭 지우기' : '환자 정면을 바닥 화살표에 맞추세요 · 두 점은 늘 같은 순서로',
    axesOn:true, planeOn:true, plane:d.plane, tracked:true, calib:false, tipOffset:[-8,6,32], url:'http://192.168.0.12:8090', csv:9, t:t,
    tip:[d.tip[0] + w, d.tip[1], d.tip[2]], eye:[0, 1.0, 1.0], lines:d.lines, pending:null };
}

// 각도기 하나 — 반원 · 15° 눈금 · 0° 선(중립) · 능동 선과 호 · 압박 선. r = {a:{v,o}|null, p:{v,o}|null}
function drawGauge(cv, m, r) {
  const dpr = window.devicePixelRatio || 1, W = cv.clientWidth, H = cv.clientHeight;
  if (cv.width !== Math.round(W * dpr) || cv.height !== Math.round(H * dpr)) { cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr); }
  const g = cv.getContext('2d'); g.setTransform(dpr, 0, 0, dpr, 0, 0); g.clearRect(0, 0, W, H);
  const z = GZERO[m], Rr = Math.min(W / 2 - 22, H - 16), px = W / 2, py = z > 0 ? H - 8 : 8;
  const P = (deg, rad) => { const a = deg * Math.PI / 180; return [px + Math.sin(a) * rad, py - Math.cos(a) * rad * z]; };
  const line = (a, b) => { g.beginPath(); g.moveTo(a[0], a[1]); g.lineTo(b[0], b[1]); g.stroke(); };
  g.strokeStyle = '#6B7A8F'; g.lineWidth = 1.5; g.lineCap = 'round';
  line([px - Rr, py], [px + Rr, py]);
  g.beginPath(); for (let d = -90; d <= 90; d += 5) { const q = P(d, Rr); d === -90 ? g.moveTo(q[0], q[1]) : g.lineTo(q[0], q[1]); } g.stroke();
  for (let d = -90; d <= 90; d += 15) line(P(d, Rr - (d % 45 === 0 ? 11 : 6)), P(d, Rr));
  g.fillStyle = '#6B7A8F'; g.font = '13px sans-serif'; g.textBaseline = 'middle';
  g.textAlign = 'right'; g.fillText(GLEFT[m], px - Rr - 5, py - z * 2); g.textAlign = 'left'; g.fillText(GRIGHT[m], px + Rr + 5, py - z * 2);
  g.strokeStyle = C_NEUTRAL; g.lineWidth = 2.5; line([px, py], P(0, Rr));
  const deg = x => Math.min(x.v, GMAX) * GSIDE[m] * (x.o ? -1 : 1);
  if (r && r.p) { g.strokeStyle = C_PRESSURE; g.lineWidth = 3; line([px, py], P(deg(r.p), Rr)); }
  if (r && r.a) {
    const d = deg(r.a);
    g.strokeStyle = C_ACTIVE; g.lineWidth = 2;
    g.beginPath(); for (let i = 0; i <= 12; i++) { const q = P(d * i / 12, Rr * 0.45); i === 0 ? g.moveTo(q[0], q[1]) : g.lineTo(q[0], q[1]); } g.stroke();
    g.lineWidth = 4; line([px, py], P(d, Rr));
  }
}

// 순서 탭의 결과표와 진행 정보
function renderGuided(free) {
  const rows = el('resRows');
  if (!rows.children.length)
    MOTIONS.forEach((name, m) => { const r = document.createElement('tr'); r.innerHTML = `<td>${name}<small>${GVIEW[m]}</small></td><td class="a"></td><td class="p"></td><td class="g"><canvas></canvas></td>`; rows.appendChild(r); });
  const res = S.results || [];
  if (!free) [...rows.children].forEach((r, m) => {
    const x = res[m] || {};
    r.className = m === S.cur ? 'now' : '';
    r.children[0].innerHTML = `${MOTIONS[m]}${(S.confirmed || '')[m] === '1' ? '<em>확인</em>' : ''}<small>${GVIEW[m]}</small>`;
    [x.a, x.p].forEach((v, k) => {
      const td = r.children[1 + k];
      td.textContent = v ? v.v.toFixed(1) + '°' : '—';
      td.className = (k === 0 ? 'a' : 'p') + (v ? (v.o ? ' opp' : '') : ' none') + (m === S.cur && S.phase === k + 1 ? ' cur' : '');
    });
    drawGauge(r.querySelector('canvas'), m, x);
  });

  el('pop').className = S.popup ? 'on' : '';
  el('bPopup').className = S.popup ? 'on' : '';
  if (!S.popup) return;
  const steps = S.steps || '';
  let done = 0;
  for (let i = 0; i < steps.length; i++) if (steps[i] === '1') done++;
  const top = S.topTabs || [], curTab = free ? 4 : S.top;
  el('popTabs').innerHTML = top.map((name, i) => `<div class="tab sub${i === curTab ? ' on' : ''}${i === S.cursor ? ' cursor' : ''}${i === 3 ? ' reset' : ''}${S.locked && i !== curTab ? ' locked' : ''}"${i === curTab ? ' style="background:#C9D3DE"' : ''}>${name}</div>`).join('');
  el('popAsk').className = S.resetAsk ? 'on' : '';
  const conf = S.confirmed || '';
  el('popRows').innerHTML = free
    ? S.tabs.map((name, i) => `<div class="prow${i === S.tab ? ' now' : ''}"><b class="name">${name}</b><span class="${i === S.tab ? 'cur' : 'todo'}">점 ${S.counts[i] || 0}개</span></div>`).join('')
    : MOTIONS.map((name, m) => `<div class="prow${m === S.cur ? ' now' : ''}"><b class="name">${name}</b><div>` +
        PHASES.map((ph, k) => `<span class="${m === S.cur && k === S.phase && !S.confirm ? 'cur' : steps[m * 3 + k] === '1' ? 'done' : 'todo'}">${ph}</span>`).join('<i>→</i>') +
        (conf[m] === '1' ? '<i></i><span class="done">(확인)</span>' : m === S.cur && S.confirm ? '<i></i><span class="cur">(트리거 = 확인)</span>' : '') + '</div></div>').join('');
  el('popHint').textContent = S.locked ? '이 탭을 재는 중입니다 — 다 잰 뒤에 다른 탭으로 옮길 수 있습니다 (그만두려면 B 길게)' : free ? '자유 측정 — 찍은 점들이 이루는 각 그대로입니다(3점 측정은 처음 찍은 묶음이 기준)' : (S.hint || '');
  el('popProg').textContent = free ? '지금  ' + S.tabs[S.tab]
    : `찍은 직선 ${done} / 18 · ` + (S.cur < 0 ? '측정 끝' : S.confirm ? `${MOTIONS[S.cur]} — 확인을 기다립니다` : `지금  ${MOTIONS[S.cur]} · ${PHASES[S.phase]}  ${(S.index || 0) + 1}번째 점`);
  el('popKeys').innerHTML = '<b>스틱 좌우</b> 탭 고르기(옮기는 대로 바뀝니다 · «리셋»만 A로 고릅니다) · <b>A</b> 닫기 · <b>B</b> ' + (free ? '취소(길게: 이 방식의 점 지우기' : '직선 취소(길게: 이 탭 지우기') + ')';
}

async function poll() {
  try {
    if (DEMO) S = demoState();
    else { const r = await fetch('/state', { cache:'no-store' }); S = await r.json(); }
    lastOk = Date.now();
  } catch (e) {}
  render();
}

function el(id) { return document.getElementById(id); }

function render() {
  const stale = Date.now() - lastOk > 1500;
  el('conn').textContent = stale ? '★헤드셋과 연결이 끊겼습니다 — 다시 연결하는 중' : (S ? `연결됨 · ${S.url || ''} · 끝점 (${(S.tipOffset || []).join(', ')})mm · 기록 ${S.csv || 0}줄` : '');
  if (!S) return;

  // 맨 위 탭 다섯(굴곡 · 신전 · 측굴 · 회전 · 기타). «기타»(자유 측정)일 때만 그 옆에 동작 갈래 셋이 붙는다.
  const tabs = el('tabs'), free = S.mode === 'free', top = S.topTabs || [];
  const key = S.mode + '|' + top.length;
  if (tabs.dataset.key !== key) {
    tabs.dataset.key = key;
    tabs.innerHTML = '';
    top.forEach((name, i) => { const d = document.createElement('div'); d.dataset.top = i; d.onclick = () => { if (i !== 3) cmd('top' + i); else if (confirm('전체 측정 결과를 지울까요? (순서 측정과 자유 측정 전부)')) cmd('resetAll'); }; tabs.appendChild(d); });
    if (free) {
      const g = document.createElement('div'); g.className = 'gap'; tabs.appendChild(g);
      S.tabs.forEach((name, i) => { const d = document.createElement('div'); d.dataset.sub = i; d.onclick = () => cmd('tab' + i); tabs.appendChild(d); });
    }
  }
  [...tabs.children].forEach(d => {
    if (d.dataset.top !== undefined) {
      const i = +d.dataset.top, on = i === S.top;
      d.className = 'tab' + (on ? ' on' : '') + (i === 3 ? ' reset' : '') + (S.locked && !on ? ' locked' : '') + (S.popup && i === S.cursor ? ' cursor' : '');
      d.style.background = on ? (free ? '#C9D3DE' : COLORS[S.tab]) : '';
      d.textContent = top[i];
    } else if (d.dataset.sub !== undefined) {
      const i = +d.dataset.sub, on = i === S.tab;
      d.className = 'tab sub' + (on ? ' on' : '');
      d.style.background = on ? COLORS[i] : '';
      d.innerHTML = S.tabs[i] + `<small>점 ${S.counts[i] || 0}</small>`;
    }
  });
  el('instruction').textContent = S.instruction || '';
  el('keys').innerHTML = free ? KEYS_FREE : KEYS_GUIDED;
  document.body.className = free ? '' : 'guided';
  el('bRebase').style.display = 'none';   // 기준선 바꾸기는 없앴다(10-13 — 3점 측정은 처음 찍은 묶음이 기준이다)
  el('bClear').textContent = free ? '이 방식의 점 지우기' : '이 탭 지우기';
  el('bConfirm').className = S.confirm ? 'on' : '';
  renderGuided(free);
  el('note').textContent = S.calib ? '끝점 보정 중 — 끝을 한 점에 대고 여러 방향으로 돌리세요' : (S.note || '');

  const tr = el('track');
  tr.className = stale ? 'off' : S.tracked ? 'ok' : 'bad';
  tr.textContent = stale ? '연결 끊김' : S.tracked ? '컨트롤러 추적 중' : '★컨트롤러가 안 보입니다';

  el('bCalib').className = S.calib ? 'on' : ''; el('bCalib').textContent = S.calib ? '끝점 보정 끝내기' : '끝점 보정';

  const col = COLORS[S.tab] || '#fff';
  el('thPlane').textContent = free ? '각' : (S.plane || '면') + ' 각'; el('thPlane').style.color = free ? C_ACTIVE : S.planeOn ? col : '#667';
  const lines = S.lines || [];
  const rows = el('rows'); rows.innerHTML = '';
  let last = null;
  lines.forEach(l => { if (free ? !!l.plane : !l.ref) last = l; });   // 자유 측정: 가장 최근에 각이 나온 선
  lines.slice().reverse().forEach(l => {
    const r = document.createElement('tr');
    r.className = l.ref ? 'ref' : (l === last ? 'last' : '');
    r.innerHTML = free
      ? `<td>선 ${l.n}</td><td>${l.len.toFixed(0)}</td><td class="plane" style="color:${l.ref ? C_NEUTRAL : C_ACTIVE}">${l.plane || ''}</td><td>${l.ref && l.plane ? '기준' : ''}</td><td class="warn">${l.warn || ''}</td>`
      : l.ref
      ? `<td>${l.name || '선 ' + l.n}</td><td>${free ? l.len.toFixed(0) : ''}</td><td>${free ? '기준선' : '중립선'}</td><td></td><td></td>`
      : `<td>${l.name || '선 ' + l.n}<span style="color:#667;font-size:13px">${free ? ' ← ' + l.refOf : ''}</span></td><td>${free ? l.len.toFixed(0) : ''}</td><td class="plane" style="color:${S.planeOn ? col : '#667'}">${l.plane || '—'}</td><td>${l.direct.toFixed(1)}°</td><td class="warn">${l.warn || ''}</td>`;
    rows.appendChild(r);
  });
  el('bigValue').textContent = last ? (last.plane || ('직접 ' + last.direct.toFixed(1) + '°')) : '—';
  el('bigValue').style.color = last && last.plane ? (free ? C_ACTIVE : col) : 'var(--ink)';
  el('bigLabel').textContent = last ? (free ? S.tabs[S.tab] : `${last.name} — 중립선에서`) : '가장 최근 측정선';
  el('bigSub').textContent = last ? (free ? '' : `직접 ${last.direct.toFixed(1)}°`) : '';
  el('bigWarn').textContent = last ? (last.warn || '') : '';

  for (let v = 0; v < 3; v++) drawView(v, lines, col);
}

// 좌표는 [환자 오른쪽, 위, 환자 앞](m). 보는 방향마다 두 성분을 고른다.
//   옆: 가로 = 앞(오른쪽이 환자 앞), 세로 = 위 / 앞: 가로 = −오른쪽(마주 보므로 환자 오른쪽이 화면 왼쪽), 세로 = 위 / 위: 가로 = −오른쪽, 세로 = 앞(아래가 환자 앞 = 헤드셋 쪽)
const PICK = [ p => [p[2], p[1]], p => [-p[0], p[1]], p => [-p[0], -p[2]] ];

function drawView(v, lines, col) {
  const box = el('v' + v), cv = box.querySelector('canvas');
  box.className = 'view' + (S.tab === v ? ' on' : '');
  box.style.borderColor = S.tab === v ? COLORS[v] : '';
  const dpr = window.devicePixelRatio || 1, W = cv.clientWidth, H = cv.clientHeight;
  if (cv.width !== Math.round(W * dpr) || cv.height !== Math.round(H * dpr)) { cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr); }
  const g = cv.getContext('2d'); g.setTransform(dpr, 0, 0, dpr, 0, 0); g.clearRect(0, 0, W, H);

  const pts = [];
  lines.forEach(l => { pts.push(l.a, l.b); });
  if (S.pending) pts.push(S.pending);
  const center = pts.length ? pts.reduce((s, p) => [s[0] + p[0], s[1] + p[1], s[2] + p[2]], [0, 0, 0]).map(x => x / pts.length) : (S.tip || [0, 1, 0]);
  let half = 0.10;
  pts.forEach(p => { for (let k = 0; k < 3; k++) half = Math.max(half, Math.abs(p[k] - center[k]) + 0.03); });
  const sc = Math.min(W, H - 26) / (2 * half), pick = PICK[v], c2 = pick(center);
  const X = p => W / 2 + (pick(p)[0] - c2[0]) * sc, Y = p => (H + 26) / 2 - (pick(p)[1] - c2[1]) * sc;

  // 눈금 — 50mm(길이는 mm, 단위 글자 없이)
  g.strokeStyle = '#1D2631'; g.lineWidth = 1;
  for (let m = -Math.ceil(half / 0.05); m <= Math.ceil(half / 0.05); m++) {
    const d = m * 0.05 * sc;
    g.beginPath(); g.moveTo(W / 2 + d, 26); g.lineTo(W / 2 + d, H); g.stroke();
    g.beginPath(); g.moveTo(0, (H + 26) / 2 + d); g.lineTo(W, (H + 26) / 2 + d); g.stroke();
  }
  g.fillStyle = '#56657A'; g.font = '12px sans-serif';
  g.fillText('눈금 50', 8, H - 8);
  g.fillText(['← 뒤   앞 →', '← 환자 오른쪽   왼쪽 →', '← 환자 오른쪽   (아래 = 앞)'][v], W - [84, 150, 170][v], H - 8);

  lines.forEach((l, i) => {
    const isLast = !l.ref && i === lines.length - 1;
    // 순서 측정: 선 1 = 중립 · 2 = 능동 · 3 = 압박(역할 색). 자유 측정: 기준선 = 중립 색, 측정선 = 능동 색(가장 최근 선만 굵게)
    g.strokeStyle = l.ref ? C_NEUTRAL : (S.mode !== 'free' && l.n === 3 ? C_PRESSURE : C_ACTIVE); g.lineWidth = l.ref ? 3 : (isLast ? 4 : 2.5);
    g.beginPath(); g.moveTo(X(l.a), Y(l.a)); g.lineTo(X(l.b), Y(l.b)); g.stroke();
    g.fillStyle = g.strokeStyle;
    g.beginPath(); g.arc(X(l.a), Y(l.a), 4.5, 0, 6.3); g.fill();           // 첫 점은 꽉 찬 점
    g.beginPath(); g.arc(X(l.b), Y(l.b), 4.5, 0, 6.3); g.stroke();         // 둘째 점은 빈 점 — 찍은 순서가 보인다
    g.font = 'bold 15px sans-serif'; g.fillText(l.n, (X(l.a) + X(l.b)) / 2 + 7, (Y(l.a) + Y(l.b)) / 2 - 5);
  });
  if (S.pending) { g.fillStyle = C_ACTIVE; g.beginPath(); g.arc(X(S.pending), Y(S.pending), 5, 0, 6.3); g.fill(); }
  if (S.tip) {
    g.strokeStyle = S.tracked ? '#FFF233' : '#FF6B6B'; g.lineWidth = 2;
    const x = X(S.tip), y = Y(S.tip);
    g.beginPath(); g.moveTo(x - 9, y); g.lineTo(x + 9, y); g.moveTo(x, y - 9); g.lineTo(x, y + 9); g.stroke();
    g.beginPath(); g.arc(x, y, 5, 0, 6.3); g.stroke();
  }
}

window.addEventListener('resize', render);
setInterval(poll, 150); poll();
</script>
</body>
