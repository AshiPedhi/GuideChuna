     착용자의 눈 화면(1인칭)을 /cam.jpg로 받자마자 다음 장을 묻는다. 해상도 버튼 = /cmd?c=res0~2. 디자인은 선 실측 관제 화면(RomLine/mirror.html)과 같다. -->
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>추나 실습</title>
<style>
  :root { --bg:#0b0d11; --line:#262e39; --text:#e8ecf1; --dim:#b8c2d1; --ok:#3ccf7a; --bad:#ff6b6b; --tabOn:#4D85D9; --tabOff:#29333f; --tabCur:#FFF233; }
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--text); font-family:"Noto Sans KR","Malgun Gothic",sans-serif; }
  body { display:flex; flex-direction:column; padding:10px 16px 12px; gap:10px; }
  header { display:flex; align-items:center; gap:16px; padding-bottom:8px; border-bottom:1px solid var(--line); }
  header img { height:36px; width:auto; display:block; }
  header h1 { margin:0; font-size:24px; font-weight:700; }
  #res { margin-left:auto; display:flex; align-items:center; gap:4px; font-size:13px; color:var(--dim); }
  #res span { margin-right:6px; }
  #res button { background:var(--tabOff); color:#fff; border:0; border-radius:4px; padding:7px 12px; font-size:14px; font-family:inherit; cursor:pointer; }
  #res button.cur { background:var(--tabOn); color:var(--tabCur); font-weight:700; }
  #mirror { flex:1; min-height:0; position:relative; background:#000; border:1px solid var(--line); border-radius:10px; overflow:hidden; cursor:zoom-in; }
  #mirror img { position:absolute; inset:0; width:100%; height:100%; object-fit:contain; object-position:center top; }
  #mirror.big { position:fixed; inset:0; z-index:10; border-radius:0; cursor:zoom-out; }
  #eCam { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; color:var(--dim); font-size:15px; text-align:center; padding:12px; }
  #foot { display:flex; flex-wrap:wrap; align-items:center; gap:4px 18px; padding-top:8px; border-top:1px solid var(--line); font-size:13px; color:var(--dim); }
  #foot b { color:var(--text); font-weight:600; }
  .dot { display:inline-block; width:8px; height:8px; border-radius:50%; background:var(--bad); margin-right:5px; vertical-align:middle; }
  .dot.on { background:var(--ok); }
  @media (max-width: 900px) {
    html, body { height:auto; }
    body { padding:8px 10px 12px; }
    header { flex-wrap:wrap; gap:8px 12px; }
    header img { height:28px; } header h1 { font-size:20px; }
    #res { margin-left:0; width:100%; } #res button { flex:1; padding:8px 4px; }
    #mirror { flex:none; width:100%; aspect-ratio:1680 / 1760; }
  }
</style>
</head>

  <h1>추나 실습</h1>
  <div id="res"><span>미러링 해상도</span></div>
</header>
<div id="mirror"><img id="iCam" alt=""><div id="eCam">미러링 영상을 기다리는 중…</div></div>
<footer id="foot">
  <span><span class="dot" id="dConn"></span><b id="conn">연결하는 중…</b></span>
  <span><span class="dot" id="dHand"></span>손 추적 <b id="hands">—</b></span>
  <span>컨트롤러 <b id="touch">—</b></span>
  <span>착용 <b id="worn">—</b></span>
  <span>배터리 <b id="batt">—</b></span>
  <span>미러링 <b id="cfps">—</b> · 인코딩 <b id="cms">—</b> · 앱 <b id="afps">—</b></span>
  <span>해상도 <b id="cres">—</b></span>
  <span>씬 <b id="scene">—</b></span>
</footer>
<script>
const $ = id => document.getElementById(id);
const resEl = $('res');
['640', '800', '1280'].forEach((r, i) => {
  const b = document.createElement('button'); b.textContent = '가로 ' + r; b.dataset.i = i;
  b.onclick = () => { fetch('/cmd?c=res' + i, { cache: 'no-store' }); resEl.querySelectorAll('button').forEach(x => x.classList.toggle('cur', x === b)); };
  resEl.appendChild(b);
});
(function stream() {
  const img = $('iCam'), empty = $('eCam');
  let url = null;
  function load() {
    fetch('/cam.jpg?t=' + Date.now(), { cache: 'no-store' }).then(r => { if (!r.ok) throw r.status; return r.blob(); }).then(b => {
      const u = URL.createObjectURL(b);
      img.onload = () => { if (url) URL.revokeObjectURL(url); url = u; empty.style.display = 'none'; setTimeout(load, 10); };
      img.src = u;
    }).catch(() => { empty.style.display = 'flex'; setTimeout(load, 1000); });
  }
  load();
})();
$('mirror').onclick = () => $('mirror').classList.toggle('big');
// 배터리(10-21) — 구간 색은 헤드셋 RomLineView.BatteryBand와 같다: 50% 초과 초록 · 20% 초과 노랑 · 20% 이하 빨강
function batt(m) {
  const e = $('batt');
  if (m.battery === undefined || m.battery < 0) { e.textContent = '—'; e.style.color = ''; return; }
  e.textContent = m.battery + '%' + (m.charging ? ' · 충전 중' : '');
  e.style.color = m.battery > 50 ? '#73E68C' : m.battery > 20 ? '#FFF233' : '#FF6B6B';
}
function info() {
  fetch('/mirrorinfo', { cache: 'no-store' }).then(r => r.json()).then(m => {
    $('conn').textContent = '연결됨'; $('dConn').classList.add('on');
    if (m.camFps === undefined) return;
    $('cfps').textContent = m.camFps + '장/s'; $('cms').textContent = m.camMs + 'ms'; $('afps').textContent = m.appFps + 'fps';
    $('cres').textContent = (m.camRes || '').replace('x', '×'); $('scene').textContent = m.scene || '—';
    $('hands').textContent = m.handOn === false ? '꺼짐' : (m.hands || '—'); $('dHand').classList.toggle('on', m.hands === '양손');
    $('touch').textContent = m.touch || '—'; $('worn').textContent = m.worn ? '쓰고 있음' : '안 씀'; batt(m);
    resEl.querySelectorAll('button').forEach(b => b.classList.toggle('cur', +b.dataset.i === m.choice));
  }).catch(() => { $('conn').textContent = '★연결 끊김'; $('dConn').classList.remove('on'); }).finally(() => setTimeout(info, 1000));
}
info();
</script>
</body>
</html>
