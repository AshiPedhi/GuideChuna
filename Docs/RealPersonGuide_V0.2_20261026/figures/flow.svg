<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 270" font-family="Malgun Gothic,sans-serif"><rect x="12" y="24" width="277" height="146" fill="#f1f6fb" stroke="#dce5ef" rx="12"/><text x="30" y="59" font-size="22" fill="#2f6fd6" font-weight="700" text-anchor="start">01</text><text x="30" y="99" font-size="23" fill="#203247" font-weight="700" text-anchor="start">기존 술기 선택</text><text x="30" y="137" font-size="18" fill="#203247" font-weight="400" text-anchor="start">시나리오는 그대로</text><text x="299" y="106" font-size="27" fill="#8fa2b3" font-weight="700" text-anchor="middle">→</text><rect x="309" y="24" width="277" height="146" fill="#f1f6fb" stroke="#dce5ef" rx="12"/><text x="327" y="59" font-size="22" fill="#2f6fd6" font-weight="700" text-anchor="start">02</text><text x="327" y="99" font-size="23" fill="#203247" font-weight="700" text-anchor="start">맞추기 누르기</text><text x="327" y="137" font-size="18" fill="#203247" font-weight="400" text-anchor="start">손이 자유로울 때 준비</text><text x="596" y="106" font-size="27" fill="#8fa2b3" font-weight="700" text-anchor="middle">→</text><rect x="606" y="24" width="277" height="146" fill="#f1f6fb" stroke="#dce5ef" rx="12"/><text x="624" y="59" font-size="22" fill="#2f6fd6" font-weight="700" text-anchor="start">03</text><text x="624" y="99" font-size="23" fill="#203247" font-weight="700" text-anchor="start">손 얹고 유지</text><text x="624" y="137" font-size="18" fill="#203247" font-weight="400" text-anchor="start">기준점·접촉 자리 등록</text><text x="893" y="106" font-size="27" fill="#8fa2b3" font-weight="700" text-anchor="middle">→</text><rect x="903" y="24" width="277" height="146" fill="#f1f6fb" stroke="#dce5ef" rx="12"/><text x="921" y="59" font-size="22" fill="#2f6fd6" font-weight="700" text-anchor="start">04</text><text x="921" y="99" font-size="23" fill="#203247" font-weight="700" text-anchor="start">기존 실습 진행</text><text x="921" y="137" font-size="18" fill="#203247" font-weight="400" text-anchor="start">기존 조건으로 자동 전환</text><text x="600" y="211" font-size="20" fill="#203247" font-weight="400" text-anchor="middle">시작 전 맞추기만 추가하고, 이후에는 기존 과정을 따른다.</text><text x="600" y="244" font-size="19" fill="#6c7b8a" font-weight="400" text-anchor="middle">사람·자세·파지가 바뀌면 필요한 기준을 다시 맞춘다.</text></svg>