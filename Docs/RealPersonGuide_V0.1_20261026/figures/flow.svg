<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 270" font-family="Malgun Gothic,sans-serif"><rect x="12" y="24" width="277" height="146" fill="#f1f6fb" stroke="#dce5ef" rx="12"/><text x="30" y="59" font-size="22" fill="#2f6fd6" font-weight="700" text-anchor="start">01</text><text x="30" y="99" font-size="23" fill="#203247" font-weight="700" text-anchor="start">시작 준비</text><text x="30" y="137" font-size="18" fill="#203247" font-weight="400" text-anchor="start">술기·시작 자세 선택</text><text x="299" y="106" font-size="27" fill="#8fa2b3" font-weight="700" text-anchor="middle">→</text><rect x="309" y="24" width="277" height="146" fill="#f1f6fb" stroke="#dce5ef" rx="12"/><text x="327" y="59" font-size="22" fill="#2f6fd6" font-weight="700" text-anchor="start">02</text><text x="327" y="99" font-size="23" fill="#203247" font-weight="700" text-anchor="start">시작 파지 등록</text><text x="327" y="137" font-size="18" fill="#203247" font-weight="400" text-anchor="start">맞추기 → 손 얹고 유지</text><text x="596" y="106" font-size="27" fill="#8fa2b3" font-weight="700" text-anchor="middle">→</text><rect x="606" y="24" width="277" height="146" fill="#fff8e9" stroke="#dce5ef" rx="12"/><text x="624" y="59" font-size="22" fill="#c08a2f" font-weight="700" text-anchor="start">03</text><text x="624" y="99" font-size="23" fill="#203247" font-weight="700" text-anchor="start">목표 등록</text><text x="624" y="137" font-size="18" fill="#203247" font-weight="400" text-anchor="start">개인화 자동 진행 시</text><text x="893" y="106" font-size="27" fill="#8fa2b3" font-weight="700" text-anchor="middle">→</text><rect x="903" y="24" width="277" height="146" fill="#f1f6fb" stroke="#dce5ef" rx="12"/><text x="921" y="59" font-size="22" fill="#2f6fd6" font-weight="700" text-anchor="start">04</text><text x="921" y="99" font-size="23" fill="#203247" font-weight="700" text-anchor="start">기존 실습 진행</text><text x="921" y="137" font-size="18" fill="#203247" font-weight="400" text-anchor="start">진행률·유지·자동 전환</text><text x="600" y="211" font-size="20" fill="#203247" font-weight="400" text-anchor="middle">목표 등록은 같은 사람·같은 동작에서 재사용한다.</text><text x="600" y="244" font-size="19" fill="#6c7b8a" font-weight="400" text-anchor="middle">사람·자세·파지가 바뀌면 이전 기준을 그대로 쓰지 않는다.</text></svg>